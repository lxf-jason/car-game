<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>极速狂飙</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  user-select: none;
}
#game-container {
  position: relative;
  width: 480px;
  height: 800px;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,150,255,0.25), 0 0 120px rgba(0,100,255,0.12);
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#ui-overlay {
  position: absolute;
  top: 0; left: 0; right: 0;
  pointer-events: none;
  padding: 16px 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
#score-panel {
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  border-radius: 12px;
  padding: 8px 16px;
  color: #fff;
}
#score-label {
  font-size: 11px;
  color: #8af;
  letter-spacing: 1px;
}
#score-value {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  line-height: 1.1;
}
#speed-panel {
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(8px);
  border-radius: 12px;
  padding: 8px 16px;
  color: #fff;
  text-align: right;
}
#speed-label {
  font-size: 11px;
  color: #f88;
  letter-spacing: 1px;
}
#speed-value {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
  line-height: 1.1;
}
#speed-unit {
  font-size: 12px;
  color: #aaa;
}
#game-over-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: auto;
  opacity: 0;
  transition: opacity 0.4s;
}
#game-over-overlay.active {
  opacity: 1;
}
#game-over-title {
  font-size: 36px;
  font-weight: 700;
  color: #ff4757;
  margin-bottom: 8px;
  text-shadow: 0 0 20px rgba(255,71,87,0.5);
}
#final-score {
  font-size: 20px;
  color: #ccc;
  margin-bottom: 6px;
}
#final-score span {
  color: #fff;
  font-size: 32px;
  font-weight: 700;
}
#best-score-text {
  font-size: 14px;
  color: #fbb040;
  margin-bottom: 28px;
}
#restart-btn {
  pointer-events: auto;
  background: linear-gradient(135deg, #ff6b6b, #ee5a24);
  color: #fff;
  border: none;
  padding: 14px 44px;
  font-size: 18px;
  font-weight: 700;
  border-radius: 40px;
  cursor: pointer;
  letter-spacing: 1px;
  box-shadow: 0 6px 24px rgba(238,90,36,0.4);
  transition: transform 0.15s, box-shadow 0.15s;
}
#restart-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 30px rgba(238,90,36,0.55);
}
#restart-btn:active {
  transform: scale(0.96);
}
#hint-text {
  position: absolute;
  bottom: 30px;
  left: 0; right: 0;
  text-align: center;
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  pointer-events: none;
}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game"></canvas>
  <div id="ui-overlay">
    <div id="score-panel">
      <div id="score-label">得分</div>
      <div id="score-value">0</div>
    </div>
    <div id="speed-panel">
      <div id="speed-label">速度</div>
      <div id="speed-value">60<span id="speed-unit">km/h</span></div>
    </div>
  </div>
  <div id="game-over-overlay">
    <div id="game-over-title">游戏结束</div>
    <div id="final-score">得分 <span>0</span></div>
    <div id="best-score-text"></div>
    <button id="restart-btn">再来一局</button>
  </div>
  <div id="hint-text">↑↓←→ 或 WASD 移动 &nbsp;|&nbsp; 鼠标点击控制方向</div>
</div>

<script>
(function() {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const W = 480, H = 800;
  canvas.width = W;
  canvas.height = H;

  // Road geometry
  const ROAD_LEFT = 80;
  const ROAD_RIGHT = W - 80;
  const ROAD_W = ROAD_RIGHT - ROAD_LEFT;
  const LANE_COUNT = 3;
  const LANE_W = ROAD_W / LANE_COUNT;
  const LANE_CENTERS = [];
  for (let i = 0; i < LANE_COUNT; i++) {
    LANE_CENTERS.push(ROAD_LEFT + LANE_W * i + LANE_W / 2);
  }

  // --- State ---
  let playerX = LANE_CENTERS[1];
  let playerY = H - 160;
  const PLAYER_W = 44;
  const PLAYER_H = 80;

  let enemies = [];
  let score = 0;
  let bestScore = 0;
  let gameOver = false;
  let started = false;
  let baseSpeed = 3;
  let speed = baseSpeed;

  // Road scroll offset
  let roadOffset = 0;
  let dashAnim = 0;

  // Particles on crash
  let particles = [];

  // Mouse target
  let mouseTargetX = null;
  let mouseTargetY = null;

  // Keys held
  const keys = {};

  // --- DOM elements ---
  const scoreValueEl = document.getElementById("score-value");
  const speedValueEl = document.getElementById("speed-value");
  const gameOverOverlay = document.getElementById("game-over-overlay");
  const finalScoreSpan = document.querySelector("#final-score span");
  const bestScoreText = document.getElementById("best-score-text");
  const restartBtn = document.getElementById("restart-btn");
  const hintText = document.getElementById("hint-text");

  // Load best
  try { bestScore = parseInt(localStorage.getItem("car_game_best") || "0"); } catch(e) {}

  function updateUI() {
    scoreValueEl.textContent = score;
    speedValueEl.textContent = Math.floor(60 + speed * 6);
    if (gameOver) {
      finalScoreSpan.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        try { localStorage.setItem("car_game_best", bestScore); } catch(e) {}
        bestScoreText.textContent = "🏆 新纪录！";
      } else {
        bestScoreText.textContent = "最高分 " + bestScore;
      }
      gameOverOverlay.classList.add("active");
      hintText.style.display = "none";
    } else {
      gameOverOverlay.classList.remove("active");
      hintText.style.display = "block";
    }
  }

  function resetGame() {
    playerX = LANE_CENTERS[1];
    playerY = H - 160;
    enemies = [];
    particles = [];
    score = 0;
    gameOver = false;
    started = false;
    baseSpeed = 3;
    speed = baseSpeed;
    roadOffset = 0;
    dashAnim = 0;
    mouseTargetX = null;
    mouseTargetY = null;
    keys["ArrowUp"] = false;
    keys["ArrowDown"] = false;
    keys["ArrowLeft"] = false;
    keys["ArrowRight"] = false;
    keys["w"] = false; keys["a"] = false; keys["s"] = false; keys["d"] = false;
    updateUI();
  }

  // --- Spawning ---
  let spawnTimer = 0;
  const SPAWN_INTERVAL_INIT = 65;

  function spawnEnemy() {
    // Pick a lane
    const lane = Math.floor(Math.random() * LANE_COUNT);
    const ex = LANE_CENTERS[lane];
    const ey = -100;

    // Enemy car colors
    const colors = [
      "#e74c3c", "#f39c12", "#2ecc71", "#3498db",
      "#9b59b6", "#1abc9c", "#e67e22", "#34495e",
      "#c0392b", "#d35400"
    ];
    const color = colors[Math.floor(Math.random() * colors.length)];

    // Occasionally spawn a double-width truck
    const isTruck = Math.random() < 0.12 && lane < LANE_COUNT - 1;
    const ew = isTruck ? LANE_W * 2 - 10 : PLAYER_W - 4;
    const eh = isTruck ? PLAYER_H + 20 : PLAYER_H + Math.random() * 14 - 7;

    enemies.push({
      x: isTruck ? ex + LANE_W / 2 : ex,
      y: ey,
      w: ew,
      h: eh,
      color: color,
      isTruck: isTruck
    });
  }

  // --- Collision ---
  function rectsCollide(a, b) {
    const shrink = 6;
    return (
      a.x - a.w / 2 + shrink < b.x + b.w / 2 - shrink &&
      a.x + a.w / 2 - shrink > b.x - b.w / 2 + shrink &&
      a.y - a.h / 2 + shrink < b.y + b.h / 2 - shrink &&
      a.y + a.h / 2 - shrink > b.y - b.h / 2 + shrink
    );
  }

  function spawnParticles(x, y) {
    for (let i = 0; i < 30; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 2 + Math.random() * 6;
      particles.push({
        x, y,
        vx: Math.cos(angle) * dist,
        vy: Math.sin(angle) * dist,
        life: 1,
        decay: 0.015 + Math.random() * 0.03,
        size: 2 + Math.random() * 5,
        color: ["#ff6b6b", "#ffa502", "#ff4757", "#fff"][Math.floor(Math.random() * 4)]
      });
    }
  }

  function endGame() {
    gameOver = true;
    spawnParticles(playerX, playerY);
    updateUI();
  }

  // --- Input ---
  document.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowRight" ||
        e.key === "w" || e.key === "a" || e.key === "s" || e.key === "d") {
      e.preventDefault();
    }
  });
  document.addEventListener("keyup", e => {
    keys[e.key] = false;
  });

  canvas.addEventListener("mousemove", e => {
    if (gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    mouseTargetX = (e.clientX - rect.left) * scaleX;
    mouseTargetY = (e.clientY - rect.top) * scaleY;
  });
  canvas.addEventListener("click", e => {
    if (gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    mouseTargetX = (e.clientX - rect.left) * scaleX;
    mouseTargetY = (e.clientY - rect.top) * scaleY;
  });

  restartBtn.addEventListener("click", () => {
    resetGame();
    updateUI();
  });

  // --- Drawing helpers ---
  function drawRoad() {
    // Grass
    const grassGrad = ctx.createLinearGradient(0, 0, ROAD_LEFT, 0);
    grassGrad.addColorStop(0, "#2d5016");
    grassGrad.addColorStop(1, "#3a6b1e");
    ctx.fillStyle = grassGrad;
    ctx.fillRect(0, 0, ROAD_LEFT, H);

    const grassGrad2 = ctx.createLinearGradient(ROAD_RIGHT, 0, W, 0);
    grassGrad2.addColorStop(0, "#3a6b1e");
    grassGrad2.addColorStop(1, "#2d5016");
    ctx.fillStyle = grassGrad2;
    ctx.fillRect(ROAD_RIGHT, 0, W - ROAD_RIGHT, H);

    // Road surface
    const roadGrad = ctx.createLinearGradient(ROAD_LEFT, 0, ROAD_RIGHT, 0);
    roadGrad.addColorStop(0, "#3a3a3a");
    roadGrad.addColorStop(0.5, "#4a4a4a");
    roadGrad.addColorStop(1, "#3a3a3a");
    ctx.fillStyle = roadGrad;
    ctx.fillRect(ROAD_LEFT, 0, ROAD_W, H);

    // Road edge lines
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(ROAD_LEFT + 2, 0);
    ctx.lineTo(ROAD_LEFT + 2, H);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ROAD_RIGHT - 2, 0);
    ctx.lineTo(ROAD_RIGHT - 2, H);
    ctx.stroke();

    // Dashed lane lines
    const dashLen = 40;
    const gapLen = 30;
    const cycle = dashLen + gapLen;
    const offset = roadOffset % cycle;

    ctx.setLineDash([dashLen, gapLen]);
    ctx.lineDashOffset = -offset;
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.lineWidth = 2;

    for (let i = 1; i < LANE_COUNT; i++) {
      const lx = ROAD_LEFT + LANE_W * i;
      ctx.beginPath();
      ctx.moveTo(lx, 0);
      ctx.lineTo(lx, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Road shoulder rumble strips
    for (let i = 0; i < 2; i++) {
      const sx = i === 0 ? ROAD_LEFT : ROAD_RIGHT;
      const rumbleOffset = (roadOffset * 1.5) % 24;
      ctx.fillStyle = i === 0 ? "#ff4444" : "#ff4444";
      for (let y = -24 + rumbleOffset; y < H + 24; y += 24) {
        ctx.fillRect(sx - 6, y, 6, 12);
        ctx.fillRect(sx, y, 6, 12);
      }
    }
  }

  function drawPlayerCar(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(-PLAYER_W / 2 + 4, -PLAYER_H / 2 + 4, PLAYER_W, PLAYER_H);

    // Car body
    const bodyGrad = ctx.createLinearGradient(-PLAYER_W/2, 0, PLAYER_W/2, 0);
    bodyGrad.addColorStop(0, "#1e90ff");
    bodyGrad.addColorStop(0.5, "#4da6ff");
    bodyGrad.addColorStop(1, "#1e90ff");
    ctx.fillStyle = bodyGrad;

    const r = 8;
    ctx.beginPath();
    ctx.moveTo(-PLAYER_W/2 + r, -PLAYER_H/2);
    ctx.lineTo(PLAYER_W/2 - r, -PLAYER_H/2);
    ctx.arcTo(PLAYER_W/2, -PLAYER_H/2, PLAYER_W/2, -PLAYER_H/2 + r, r);
    ctx.lineTo(PLAYER_W/2, PLAYER_H/2 - r);
    ctx.arcTo(PLAYER_W/2, PLAYER_H/2, PLAYER_W/2 - r, PLAYER_H/2, r);
    ctx.lineTo(-PLAYER_W/2 + r, PLAYER_H/2);
    ctx.arcTo(-PLAYER_W/2, PLAYER_H/2, -PLAYER_W/2, PLAYER_H/2 - r, r);
    ctx.lineTo(-PLAYER_W/2, -PLAYER_H/2 + r);
    ctx.arcTo(-PLAYER_W/2, -PLAYER_H/2, -PLAYER_W/2 + r, -PLAYER_H/2, r);
    ctx.closePath();
    ctx.fill();

    // Windshield (front)
    ctx.fillStyle = "rgba(180,220,255,0.7)";
    ctx.fillRect(-PLAYER_W/2 + 8, -PLAYER_H/2 + 10, PLAYER_W - 16, 22);

    // Rear window
    ctx.fillStyle = "rgba(180,220,255,0.5)";
    ctx.fillRect(-PLAYER_W/2 + 8, PLAYER_H/2 - 32, PLAYER_W - 16, 18);

    // Roof
    ctx.fillStyle = "rgba(30,120,220,0.4)";
    ctx.fillRect(-PLAYER_W/2 + 6, -PLAYER_H/2 + 36, PLAYER_W - 12, PLAYER_H - 72);

    // Headlights
    ctx.fillStyle = "#ffeaa7";
    ctx.shadowColor = "#ffeaa7";
    ctx.shadowBlur = 8;
    ctx.fillRect(-PLAYER_W/2 + 4, -PLAYER_H/2 + 4, 6, 5);
    ctx.fillRect(PLAYER_W/2 - 10, -PLAYER_H/2 + 4, 6, 5);
    ctx.shadowBlur = 0;

    // Taillights
    ctx.fillStyle = "#ff4757";
    ctx.shadowColor = "#ff4757";
    ctx.shadowBlur = 6;
    ctx.fillRect(-PLAYER_W/2 + 4, PLAYER_H/2 - 9, 6, 5);
    ctx.fillRect(PLAYER_W/2 - 10, PLAYER_H/2 - 9, 6, 5);
    ctx.shadowBlur = 0;

    // Racing stripes
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.fillRect(-4, -PLAYER_H/2 + 34, 8, PLAYER_H - 68);

    ctx.restore();
  }

  function drawEnemyCar(e) {
    ctx.save();
    ctx.translate(e.x, e.y);

    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(-e.w/2 + 3, -e.h/2 + 3, e.w, e.h);

    // Body
    const bodyGrad = ctx.createLinearGradient(-e.w/2, 0, e.w/2, 0);
    bodyGrad.addColorStop(0, e.color);
    bodyGrad.addColorStop(0.5, e.color);
    bodyGrad.addColorStop(1, e.color);
    ctx.fillStyle = bodyGrad;

    const r = 6;
    ctx.beginPath();
    ctx.moveTo(-e.w/2 + r, -e.h/2);
    ctx.lineTo(e.w/2 - r, -e.h/2);
    ctx.arcTo(e.w/2, -e.h/2, e.w/2, -e.h/2 + r, r);
    ctx.lineTo(e.w/2, e.h/2 - r);
    ctx.arcTo(e.w/2, e.h/2, e.w/2 - r, e.h/2, r);
    ctx.lineTo(-e.w/2 + r, e.h/2);
    ctx.arcTo(-e.w/2, e.h/2, -e.w/2, e.h/2 - r, r);
    ctx.lineTo(-e.w/2, -e.h/2 + r);
    ctx.arcTo(-e.w/2, -e.h/2, -e.w/2 + r, -e.h/2, r);
    ctx.closePath();
    ctx.fill();

    // Windshield
    ctx.fillStyle = "rgba(180,210,240,0.55)";
    ctx.fillRect(-e.w/2 + 6, -e.h/2 + 8, e.w - 12, 18);

    // Rear window
    ctx.fillStyle = "rgba(180,210,240,0.4)";
    ctx.fillRect(-e.w/2 + 6, e.h/2 - 26, e.w - 12, 14);

    // Taillights (facing player at top of screen, so taillights on "bottom")
    ctx.fillStyle = "#ff4757";
    ctx.shadowColor = "#ff4757";
    ctx.shadowBlur = 4;
    ctx.fillRect(-e.w/2 + 3, e.h/2 - 8, 5, 4);
    ctx.fillRect(e.w/2 - 8, e.h/2 - 8, 5, 4);
    ctx.shadowBlur = 0;

    if (e.isTruck) {
      // Truck markings
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.fillRect(-e.w/2 + 4, -e.h/2 + 30, e.w - 8, e.h - 60);
    }

    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  // --- Game loop ---
  function update() {
    if (gameOver) {
      // Update particles
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        p.vy += 0.08;
      }
      particles = particles.filter(p => p.life > 0);
      return;
    }

    // Speed ramps
    speed = baseSpeed + score * 0.015;

    // Road scroll
    roadOffset += speed;

    // Player movement
    const moveSpeed = 5;

    // Keyboard
    let dx = 0, dy = 0;
    if (keys["ArrowLeft"] || keys["a"]) dx -= 1;
    if (keys["ArrowRight"] || keys["d"]) dx += 1;
    if (keys["ArrowUp"] || keys["w"]) dy -= 1;
    if (keys["ArrowDown"] || keys["s"]) dy += 1;

    if (dx !== 0 || dy !== 0) {
      started = true;
      const len = Math.sqrt(dx*dx + dy*dy);
      dx = (dx / len) * moveSpeed;
      dy = (dy / len) * moveSpeed;
      playerX += dx;
      playerY += dy;
      mouseTargetX = null;
      mouseTargetY = null;
    }

    // Mouse follow
    if (mouseTargetX !== null && mouseTargetY !== null) {
      started = true;
      const tdx = mouseTargetX - playerX;
      const tdy = mouseTargetY - playerY;
      const dist = Math.sqrt(tdx*tdx + tdy*tdy);
      if (dist > 2) {
        const easing = Math.min(0.12, moveSpeed / dist);
        playerX += tdx * easing;
        playerY += tdy * easing;
      }
    }

    // Clamp player
    playerX = Math.max(ROAD_LEFT + PLAYER_W/2, Math.min(ROAD_RIGHT - PLAYER_W/2, playerX));
    playerY = Math.max(PLAYER_H/2, Math.min(H - PLAYER_H/2, playerY));

    // Spawn enemies
    spawnTimer++;
    const interval = Math.max(18, SPAWN_INTERVAL_INIT - score * 0.5);
    if (spawnTimer >= interval) {
      spawnTimer = 0;
      spawnEnemy();
      // Sometimes double spawn
      if (Math.random() < 0.25 && score > 10) spawnEnemy();
    }

    // Move enemies
    for (const e of enemies) {
      e.y += speed + (e.isTruck ? 0.3 : 0.8);
    }

    // Check collisions
    const playerRect = { x: playerX, y: playerY, w: PLAYER_W, h: PLAYER_H };
    for (const e of enemies) {
      if (rectsCollide(playerRect, { x: e.x, y: e.y, w: e.w, h: e.h })) {
        endGame();
        return;
      }
    }

    // Remove off-screen enemies & score
    const before = enemies.length;
    enemies = enemies.filter(e => e.y < H + 150);
    const removed = before - enemies.length;
    if (removed > 0) {
      score += removed;
      updateUI();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawRoad();

    // Draw enemies
    for (const e of enemies) {
      drawEnemyCar(e);
    }

    // Draw player
    if (!gameOver) {
      drawPlayerCar(playerX, playerY);
    }

    // Particles (on top)
    drawParticles();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // Init
  updateUI();
  loop();
})();
</script>
</body>
</html>
